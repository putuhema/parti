<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Juragan tile template, drawn at 2x (256 × 256). Draw your tile, hide the "guides" layer, export as PNG. -->
  <g id="guides" font-family="sans-serif" font-size="9" fill="#8a7f74">
    <rect x="0.5" y="0.5" width="255" height="255" fill="#fff" stroke="#d8d0c4" stroke-dasharray="4 4" />
    <!-- headroom: art may rise into this band (gates, statues, trees) -->
    <rect x="0" y="0" width="256" height="88" fill="#f4c64e" opacity=".12" />
    <text x="8" y="16">HEADROOM 0–88 (optional, for tall art)</text>
    <!-- top face: the 2:1 diamond the board's grid is made of -->
    <polygon points="128,88 256,152 128,216 0,152" fill="#f3ede0" stroke="#231b1a" stroke-width="2" />
    <!-- side faces: 40px deep -->
    <polygon points="0,152 128,216 128,256 0,192" fill="#d9c9a8" stroke="#231b1a" stroke-width="2" />
    <polygon points="128,216 256,152 256,192 128,256" fill="#c4b08a" stroke="#231b1a" stroke-width="2" />
    <!-- centre of the top face (the anchor): figures and buildings stand here -->
    <circle cx="128" cy="152" r="3" fill="#e2574c" />
    <!-- where the game writes the name and price, flat on the top face: keep it calm -->
    <polygon points="128,120 192,152 128,184 64,152" fill="none" stroke="#e2574c" stroke-dasharray="3 3" />
    <text x="128" y="110" text-anchor="middle">TOP FACE 256 × 128</text>
    <text x="40" y="235" text-anchor="middle">LEFT SIDE</text>
    <text x="216" y="235" text-anchor="middle">RIGHT SIDE</text>
  </g>
</svg>
